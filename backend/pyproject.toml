
[project]
name = "mutatis-mutandis-extract"
version = "0.1.0"
description = "Passage search for historical texts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "lancedb>=0.40.0",
    "langdetect>=1.0.9",
    "lxml>=6.1.3",
    "numpy>=2.4.6",
    "psycopg>=3.3.6",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutatis_mutandis"]

