
[project]
name = "mutatis-mutandis-extract"
version = "0.1.0"
description = "Passage search for historical texts"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mutatis_mutandis"]

